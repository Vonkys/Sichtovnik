
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Šichtovník</title>

<style>
:root {
    --bg: #f1f4f9;
    --card: #ffffff;
    --text: #18243a;
    --muted: #8290a5;
    --blue: #3478e5;
    --border: #e8edf4;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.app {
    max-width: 850px;
    margin: auto;
    padding: 22px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 1px;
}

.subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 5px;
}

.settings {
    border: none;
    background: white;
    padding: 12px;
    border-radius: 12px;
    font-size: 20px;
    cursor: pointer;
}

.card {
    background: var(--card);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 4px 18px rgba(20,40,80,.04);
}

.month-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.month-title {
    font-size: 22px;
    font-weight: 750;
    text-transform: capitalize;
}

.nav {
    display: flex;
    gap: 8px;
}

.nav button {
    border: none;
    background: #f0f4fa;
    border-radius: 10px;
    width: 38px;
    height: 38px;
    font-size: 22px;
    cursor: pointer;
}

.weekdays, .calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 5px;
}

.weekdays div {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    font-weight: bold;
    padding: 9px 0;
}

.day {
    min-height: 72px;
    border-radius: 11px;
    background: #f8f9fc;
    border: 2px solid transparent;
    padding: 7px 3px;
    cursor: pointer;
    text-align: center;
    transition: .15s;
    min-width: 0;
}

.day:hover { background: #edf3ff; }

.day.other {
    opacity: .3;
}

.day.today {
    border-color: var(--blue);
}

.day.selected {
    background: #e8f0ff;
    border-color: var(--blue);
}

.day-number {
    font-size: 14px;
    font-weight: 700;
}

/* Zvýraznění státních svátků */
.day.holiday {
    background: #fff1f3;
    border-color: #f4c5ce;
}

.holiday-name {
    display: block;
    width: fit-content;
    margin: 5px auto 0;
    padding: 3px 5px;
    border-radius: 5px;
    background: #ffe0e5;
    color: #b33250;
    font-size: 8px;
    font-weight: bold;
    letter-spacing: .3px;
}

.name-day {
    display: block;
    margin-top: 4px;
    color: #3478e5;
    font-size: 9px;
    font-weight: bold;
}

.shift {
    display: block;
    margin: 7px auto 0;
    padding: 4px 2px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: bold;
    max-width: 48px;
}

.shift-R { background: #1508d4; color: #f4f4f5; }
.shift-P { background: #e9d00c; color: #f4f4f5; }
.shift-N { background: #f32525; color: #f4f4f5; }
.shift-V { background: #0ae441; color: #f4f4f5; }
.shift-D { background: #864508; color: #f4f4f5; }

.day-info {
    margin-top: 18px;
    padding: 16px;
    background: #f7f9fc;
    border-radius: 13px;
}

.day-info h3 {
    margin: 0 0 7px;
    font-size: 17px;
}

.muted {
    color: var(--muted);
    font-size: 13px;
}

.section-title {
    font-size: 13px;
    font-weight: bold;
    color: var(--muted);
    letter-spacing: .7px;
    margin-bottom: 15px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin: 16px 0 8px;
}

select, textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: #f9fafc;
    border-radius: 10px;
    padding: 13px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
}

textarea {
    resize: vertical;
    min-height: 100px;
}

.save-status {
    font-size: 12px;
    color: #27965a;
    margin-top: 8px;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
}

.legend span {
    display: flex;
    align-items: center;
    gap: 5px;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
}

footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    padding: 15px;
}

@media(max-width:480px) {
    .app { padding: 13px; }
    .card { padding: 13px; }
    .day { min-height: 60px; }
    .day-number { font-size: 13px; }
    .shift { font-size: 9px; }
    .month-title { font-size: 19px; }
}
</style>
</head>

<div class="app">

<header>
    <div>
        <div class="logo">ŠICHTOVNÍK</div>
        <div class="subtitle">AGC Automotive Czech - směna A</div>
    </div>
</header>

<section class="card">

    <div class="month-header">
        <div class="month-title" id="monthTitle"></div>
        <div class="nav">
            <button onclick="changeMonth(-1)">‹</button>
            <button onclick="changeMonth(1)">›</button>
        </div>
    </div>

    <div class="weekdays">
        <div>PO</div>
        <div>ÚT</div>
        <div>ST</div>
        <div>ČT</div>
        <div>PÁ</div>
        <div>SO</div>
        <div>NE</div>
    </div>

    <div class="calendar" id="calendar"></div>

    <div class="legend" style="margin-top:18px">
        <span><i class="dot" style="background:#1508d4"></i> Ranní</span>
        <span><i class="dot" style="background:#f32525"></i> Noční</span>
        <span><i class="dot" style="background:#0ae441"></i> Volno</span>
        <span><i class="dot" style="background:#864508"></i> Dovolená</span>
        <span><i class="dot" style="background:#e9d00c"></i> Přesčas</span>

</section>

<section class="card">

    <div class="section-title">VYBRANÝ DEN</div>

    <div class="day-info">

        <div class="muted" id="selectedInfo">
            Kliknutím na datum zobrazíš jeho podrobnosti.
        </div>
    <div class="muted" id="holidayInfo" style="margin-top:8px; color:#c03955;"></div>
    <div class="muted" id="nameDayInfo" style="margin-top:6px; color:#3478e5;"></div>
        </div>

    <label for="shiftSelect">Pracovní směna</label>

        <option value="D">Dovolená</option>
        <option value="P">Přesčas</option>
    </select>

    <label for="note">Poznámka k danému dni</label>

    <div class="save-status" id="saveStatus">
        Změny se ukládají automaticky.
    </div>

</section>

<footer>
    Šichtovník · Tvoje směny, tvůj čas.
</footer>

</div>

// Pevný 28denní směnový graf.
// Referenční datum: 19. 11. 2026 = 4. týden, čtvrtek = druhá noční.
const cycleWeeks = [
    "RRVVNNN",
    "VVRRVVV",
    "NNVVRRR",
    "VVNNVVV"
];
const cycle = cycleWeeks.join("");
const referenceDate = new Date(2026, 10, 19);
const referenceCycleIndex = 24; // 19. 11. 2026 = 4. týden cyklu, 4. den (druhé N)

// Ruční změny mají přednost před automatickým grafem.
let shiftOverrides = JSON.parse(localStorage.getItem("shiftOverrides") || "{}");
let notes = JSON.parse(localStorage.getItem("notes") || "{}");

function getAutomaticShift(date) {
    const day = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const diff = Math.round((day - referenceDate) / 86400000);
    const index = ((diff + referenceCycleIndex) % 28 + 28) % 28;
    return cycle[index];
}

function getShift(date) {
    const key = dateKey(date);
    return Object.prototype.hasOwnProperty.call(shiftOverrides, key)
        ? shiftOverrides[key]
        : getAutomaticShift(date);
}

function getCyclePosition(date) {
    const day = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const diff = Math.round((day - referenceDate) / 86400000);
    const index = ((diff + referenceCycleIndex) % 28 + 28) % 28;
    return { week: Math.floor(index / 7) + 1, day: (index % 7) + 1 };
}

function dateKey(date) {
    return date.getFullYear() + "-" +
        String(date.getMonth()+1).padStart(2,"0") + "-" +
        String(date.getDate()).padStart(2,"0");
}

// Vrátí jmeniny pro konkrétní datum
function getNameDay(date) {
    const month = date.getMonth() + 1;
    const day = date.getDate();

    if (!nameDays[month]) {
        return "";
    }

    return nameDays[month][day - 1] || "";
}

// České státní svátky
function getHolidayName(date) {
    const year = date.getFullYear();

    const fixedHolidays = {
        "01-01": "Nový rok a Den obnovy samostatného českého státu",
        "05-01": "Svátek práce",
        "05-08": "Den vítězství",
        "07-05": "Den slovanských věrozvěstů Cyrila a Metoděje",
        "07-06": "Den upálení mistra Jana Husa",
        "09-28": "Den české státnosti",
        "10-28": "Den vzniku samostatného československého státu",
        "11-17": "Den boje za svobodu a demokracii",
        "12-24": "Štědrý den",
        "12-25": "1. svátek vánoční",
        "12-26": "2. svátek vánoční"
    };

    const key = String(date.getMonth() + 1).padStart(2, "0") +
                "-" + String(date.getDate()).padStart(2, "0");

    if (fixedHolidays[key]) {
        return fixedHolidays[key];
    }

    // Výpočet Velikonoční neděle
    const a = year % 19;
    const b = Math.floor(year / 100);
    const c = year % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);

    const easterMonth = Math.floor((h + l - 7 * m + 114) / 31);
    const easterDay = ((h + l - 7 * m + 114) % 31) + 1;

    const easterSunday = new Date(year, easterMonth - 1, easterDay);

    const goodFriday = new Date(easterSunday);
    goodFriday.setDate(goodFriday.getDate() - 2);

    const easterMonday = new Date(easterSunday);
    easterMonday.setDate(easterMonday.getDate() + 1);

    if (dateKey(date) === dateKey(goodFriday)) {
        return "Velký pátek";
    }

    if (dateKey(date) === dateKey(easterMonday)) {
        return "Velikonoční pondělí";
    }

    return "";
}

function renderCalendar() {

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthTitle").textContent =
        months[month] + " " + year;

    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    const firstDay = new Date(year,month,1);
    let startDay = (firstDay.getDay()+6)%7;

    const daysInMonth = new Date(year,month+1,0).getDate();

    const totalCells = Math.ceil((startDay+daysInMonth)/7)*7;

    for(let i=0;i<totalCells;i++) {

        const dayNumber = i-startDay+1;

        const cellDate = new Date(year,month,dayNumber);
        const key = dateKey(cellDate);

        const isOther = dayNumber<1 || dayNumber>daysInMonth;
        const isToday = key===dateKey(new Date());
        const isSelected = key===dateKey(selectedDate);

        const shift = getShift(cellDate);
        const holidayName = getHolidayName(cellDate);
        const nameDay = getNameDay(cellDate);
        
        const cell = document.createElement("div");
        cell.className = "day";

        if(isOther) cell.classList.add("other");
if(isToday) cell.classList.add("today");
if(isSelected) cell.classList.add("selected");

if(holidayName && !isOther) {
    cell.classList.add("holiday");
    cell.title = holidayName;
}

const number = document.createElement("div");
number.className = "day-number";
number.textContent = cellDate.getDate();

cell.appendChild(number);


        
if(nameDay && !isOther) {
    const nameDayLabel = document.createElement("span");
    nameDayLabel.className = "name-day";
    nameDayLabel.textContent = nameDay.split(",")[0];
    nameDayLabel.title = nameDay;
    cell.appendChild(nameDayLabel);
}        



        if(shift) {
            const badge = document.createElement("span");
            badge.className = "shift shift-"+shift;
            badge.textContent = shift;
            cell.appendChild(badge);
        }

        cell.onclick = () => {
            selectedDate = cellDate;
            renderCalendar();
            showSelectedDay();
        };

        calendar.appendChild(cell);
    }
}

function showSelectedDay() {

    const key = dateKey(selectedDate);

    document.getElementById("selectedDate").textContent =
        weekdays[selectedDate.getDay()] + " " +
        selectedDate.getDate() + ". " +
        months[selectedDate.getMonth()] + " " +
        selectedDate.getFullYear();

    const shiftNames = {
        R:"Ranní směna",
        P:"Přesčas",
        N:"Noční směna",
        V:"Volno",
        D:"Dovolená"
    };

    const selectedShift = getShift(selectedDate);
    const isOverride = Object.prototype.hasOwnProperty.call(shiftOverrides, key);
    document.getElementById("selectedInfo").textContent =
        (shiftNames[selectedShift] || "Zatím není nastavena žádná směna.") +
        (isOverride ? " · ručně upraveno" : " · podle automatického grafu");

    // Zobrazení státního svátku
const holiday = getHolidayName(selectedDate);

document.getElementById("holidayInfo").textContent =
    holiday ? "🎉 " + holiday : "";
    
// Zobrazení jmenin
const nameDay = getNameDay(selectedDate);

document.getElementById("nameDayInfo").textContent =
    nameDay ? "🎂 Jmeniny: " + nameDay : "";    
    
    document.getElementById("shiftSelect").value =
        getShift(selectedDate) || "";

    document.getElementById("note").value =
        notes[key] || "";

    const position = getCyclePosition(selectedDate);
    document.getElementById("cycleInfo").textContent =
        position.week + ". týden cyklu · " + position.day + ". den · " +
        (getShift(selectedDate) === "R" ? "Ranní směna" :
         getShift(selectedDate) === "N" ? "Noční směna" : "Volno");
}

function changeMonth(amount) {
    currentDate.setMonth(currentDate.getMonth()+amount);
    renderCalendar();
}

document.getElementById("shiftSelect").addEventListener("change",function() {

    const key = dateKey(selectedDate);

    if(this.value) {
        shiftOverrides[key] = this.value;
    } else {
        delete shiftOverrides[key];
    }

    localStorage.setItem("shiftOverrides",JSON.stringify(shiftOverrides));

    renderCalendar();
    showSelectedDay();
    showSaved();
});

document.getElementById("note").addEventListener("input",function() {

    const key = dateKey(selectedDate);

    if(this.value.trim()) {
        notes[key] = this.value;
    } else {
        delete notes[key];
    }

    localStorage.setItem("notes",JSON.stringify(notes));
    showSaved();
});

function showSaved() {
    document.getElementById("saveStatus").textContent =
        "✓ Uloženo v tomto zařízení";
}

renderCalendar();
showSelectedDay();

</script>

</body>
</html>
